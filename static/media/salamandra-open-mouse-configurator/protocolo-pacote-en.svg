 y="194" fill="#efe9dc" font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">data</text><text x="166.25" y="232" fill="#5aa9e6" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">little-endian: 0x0449</text><text x="602.25" y="232" fill="#efe9dc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">LED: color, mode, speed</text><text x="492.0" y="196" fill="#efe9dc" font-size="1" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="492.0" y="250" fill="#efe9dc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">R</text><text x="546.5" y="196" fill="#efe9dc" font-size="1" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="546.5" y="250" fill="#efe9dc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">G</text><text x="601.0" y="196" fill="#efe9dc" font-size="1" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="601.0" y="250" fill="#efe9dc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">B</text><text x="655.5" y="196" fill="#efe9dc" font-size="1" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="655.5" y="250" fill="#efe9dc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">mode</text><text x="710.0" y="196" fill="#efe9dc" font-size="1" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="710.0" y="250" fill="#efe9dc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">spd</text><text x="764.5" y="196" fill="#efe9dc" font-size="1" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="764.5" y="250" fill="#efe9dc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">sub</text><text x="450.0" y="284" fill="#9a93ab" font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">rid 02 = 16 bytes   03 = 64 bytes   04 = 256 bytes</text><text x="450.0" y="308" fill="#9a93ab" font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">F3 write   F2 read   F1 apply   F5 session</text></svg>